<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Repartidor - Kigo Xpress</title>
<style>
:root{--rojo:#ef4444;--negro:#111111;--blanco:#ffffff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--blanco);color:var(--negro)}
.header{background:var(--negro);color:var(--blanco);padding:16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:18px}.header span{font-size:11px;background:var(--rojo);padding:4px 8px;border-radius:20px}
.tabs{display:flex;background:var(--negro);padding:0 12px;gap:8px}
.tab{flex:1;padding:12px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;border-radius:12px 12px 0 0;background:#222;color:#888}
.tab.active{background:var(--blanco);color:var(--negro)}
.container{padding:12px;max-width:600px;margin:auto}
.card{background:#fff;border:2px solid #111;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:4px 4px 0 #111;animation:entra .3s ease}
@keyframes entra{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.card.nuevo{border-color:var(--rojo);box-shadow:4px 4px 0 var(--rojo);animation:pop .6s infinite alternate}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.02)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.id{font-weight:900;font-size:13px}.badge{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:900;color:#fff}
.pendiente{background:var(--rojo)}.aceptado{background:#f59e0b}.en_camino{background:#3b82f6}.entregado{background:var(--negro)}
.ruta{font-size:14px;line-height:1.4;margin:8px 0}.precio{font-size:20px;font-weight:900}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;padding:12px;border-radius:12px;border:2px solid #111;font-weight:800;cursor:pointer;text-align:center;min-width:90px}
.btn-rojo{background:var(--rojo);color:#fff}.btn-negro{background:var(--negro);color:#fff}.btn-blanco{background:#fff;color:#111}
.btn:disabled{opacity:.4}
.historial-item{background:#f7f7f7;border:1px dashed #111;border-radius:14px;padding:12px;margin-bottom:8px;font-size:13px}
.sound-btn{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--rojo);color:#fff;border:3px solid #111;border-radius:50px;padding:14px 18px;font-weight:900;box-shadow:4px 4px 0 #111;cursor:pointer}
</style>
</head>
<body>
<div class="header"><b>🛵 KIGO XPRESS</b><span id="contador">0 PEDIDOS</span></div>
<div class="tabs"><div id="tabActivos" class="tab active" onclick="switchTab('activos')">ACTIVOS</div><div id="tabHistorial" class="tab" onclick="switchTab('historial')">HISTORIAL HOY</div></div>

<div class="container">
<div id="vistaActivos"></div>
<div id="vistaHistorial" style="display:none"></div>
</div>

<button id="activarSonido" class="sound-btn">🔔 ACTIVAR SONIDO</button>
<audio id="audioNotif" preload="auto">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoVX8XacnE6OeguLOp_J3QKhfUrZnUB_4",
  authDomain: "kigo-xpress.firebaseapp.com",
  projectId: "kigo-xpress",
  storageBucket: "kigo-xpress.firebasestorage.app",
  messagingSenderId: "358613713443",
  appId: "1:358613713443:web:0b9d407dab250f13c56796",
  measurementId: "G-FDP4Q838T0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pedidos = [];
let sonidoActivado = false;
let primerCarga = true;
let tabActual = 'activos';

const audio = document.getElementById("audioNotif");
document.getElementById("activarSonido").addEventListener("click", async()=>{
  sonidoActivado = true;
  try{ await audio.play(); audio.pause(); }catch(e){}
  document.getElementById("activarSonido").innerText = "✅ SONIDO ACTIVO";
  setTimeout(()=>document.getElementById("activarSonido").style.display="none", 1500);
  if('vibrate' in navigator) navigator.vibrate(100);
});

function playSound(){
  if(!sonidoActivado) return;
  audio.currentTime=0;
  audio.play().catch(()=>{});
  if('vibrate' in navigator) navigator.vibrate([300,100,300]);
  // Notificacion del sistema
  if(Notification && Notification.permission==="granted"){
    new Notification("¡Nuevo pedido Kigo! 🛵",{body:"Tienes un pedido nuevo por entregar"});
  }
}
if(Notification && Notification.permission!=="granted"){ Notification.requestPermission(); }

const q = query(collection(db,"pedidos"), orderBy("timestamp","desc"));
onSnapshot(q, (snap)=>{
  const nuevosIds = [];
  snap.docChanges().forEach(change=>{
    if(change.type==="added" && !primerCarga){
      if(change.doc.data().estado==="pendiente") nuevosIds.push(change.doc.id);
    }
  });
  if(nuevosIds.length>0) playSound();

  pedidos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  render();
  primerCarga=false;
});

function render(){
  const activos = pedidos.filter(p=>p.estado!=="entregado");
  const historial = pedidos.filter(p=>p.estado==="entregado");
  document.getElementById("contador").innerText = `${activos.length} PEDIDOS`;

  // ACTIVOS
  const vA = document.getElementById("vistaActivos");
  if(activos.length===0) vA.innerHTML="<p style='text-align:center;padding:40px;color:#999'>Sin pedidos activos.<br>Esperando clientes...</p>";
  else vA.innerHTML = activos.map(p=>{
    const esNuevo = p.estado==="pendiente";
    return `<div class="card ${esNuevo?'nuevo':''}">
      <div class="top"><span class="id">${p.numero_servicio}</span><span class="badge ${p.estado}">${p.estado.toUpperCase()}</span></div>
      <div class="ruta">📍 <b>${p.colonia_recogida}</b><br>🏁 <b>${p.colonia_entrega}</b></div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="precio">${p.valor_servicio}</span><span>${p.distancia} • ${p.tiempo_estimado}</span></div>
      <div style="font-size:11px;color:#666;margin-top:4px">${p.fecha_hora}</div>
      <a href="${p.url_google_maps}" target="_blank" style="display:block;margin-top:8px;font-size:12px;font-weight:800;color:#111">📍 ABRIR RUTA EN MAPS</a>
      <div class="btns">
        ${p.estado==="pendiente" ? `<button class="btn btn-rojo" onclick="cambiar('${p.id}','aceptado')">ACEPTAR PEDIDO</button><button class="btn btn-blanco" onclick="eliminar('${p.id}')">RECHAZAR</button>` : ``}
        ${p.estado==="aceptado" ? `<button class="btn btn-negro" onclick="cambiar('${p.id}','en_camino')">YA RECOGÍ 🛵</button>` : ``}
        ${p.estado==="en_camino" ? `<button class="btn btn-negro" style="background:#22c55e;border-color:#111" onclick="cambiar('${p.id}','entregado')">ENTREGADO ✅</button>` : ``}
      </div>
    </div>`;
  }).join("");

  // HISTORIAL
  const vH = document.getElementById("vistaHistorial");
  let totalHoy = 0;
  historial.forEach(h=>{ const val = parseInt((h.valor_servicio||"").replace(/[^0-9]/g,""))||0; totalHoy+=val; });
  if(historial.length===0) vH.innerHTML="<p style='text-align:center;padding:40px;color:#999'>Aún no has entregado pedidos hoy</p>";
  else vH.innerHTML = `<div style="background:#111;color:#fff;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between"><b>HISTORIAL HOY: ${historial.length} entregas</b><b>$${totalHoy}</b></div>` + historial.map(p=>`<div class="historial-item"><b>${p.numero_servicio}</b> - ${p.colonia_recogida} → ${p.colonia_entrega}<br>${p.valor_servicio} • ${p.fecha_hora}</div>`).join("");
}

window.cambiar = async(id,estado)=>{ await updateDoc(doc(db,"pedidos",id),{estado}) };
window.eliminar = async(id)=>{
  const { doc:doc2, deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  if(confirm("¿Rechazar/eliminar este pedido?")) await (await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")).deleteDoc(doc2(db,"pedidos",id));
};
window.switchTab = (t)=>{
  tabActual=t;
  document.getElementById("tabActivos").classList.toggle("active", t==="activos");
  document.getElementById("tabHistorial").classList.toggle("active", t==="historial");
  document.getElementById("vistaActivos").style.display = t==="activos"?"block":"none";
  document.getElementById("vistaHistorial").style.display = t==="historial"?"block":"none";
}
</script>
</body>
</html>
