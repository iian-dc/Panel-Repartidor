<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Repartidor - Kigo</title>
<style>
:root{--rojo:#ef4444;--negro:#111;--blanco:#fff}
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#fff}
.header{background:var(--negro);color:#fff;padding:16px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between}
.tabs{display:flex;background:var(--negro);padding:0 12px;gap:8px}.tab{flex:1;padding:12px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;border-radius:12px 12px 0 0;background:#222;color:#888}.tab.active{background:#fff;color:#111}
.container{padding:12px;max-width:600px;margin:auto}
.card{background:#fff;border:2px solid #111;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:4px 4px 0 #111}
.card.nuevo{border-color:var(--rojo);box-shadow:4px 4px 0 var(--rojo);animation:temblor .2s infinite}
@keyframes temblor{0%{transform:rotate(0)}25%{transform:rotate(1deg)}50%{transform:rotate(0)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
.badge{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:900;color:#fff}.pendiente{background:var(--rojo)}.aceptado{background:#f59e0b}.en_camino{background:#3b82f6}.entregado{background:#111}
.btn{flex:1;padding:12px;border-radius:12px;border:2px solid #111;font-weight:800;cursor:pointer}.btn-rojo{background:var(--rojo);color:#fff}.btn-negro{background:var(--negro);color:#fff}.btns{display:flex;gap:8px;margin-top:10px}
.sound-btn{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--rojo);color:#fff;border:3px solid #111;border-radius:50px;padding:16px 20px;font-weight:900;box-shadow:4px 4px 0 #111}
</style></head><body>
<div class="header"><b>🛵 KIGO XPRESS</b><span id="contador">0</span></div>
<div class="tabs"><div id="tabActivos" class="tab active" onclick="switchTab('activos')">ACTIVOS</div><div id="tabHistorial" class="tab" onclick="switchTab('historial')">HISTORIAL</div></div>
<div class="container"><div id="vistaActivos"></div><div id="vistaHistorial" style="display:none"></div></div>
<button id="activarSonido" class="sound-btn">🔔 ACTIVAR SONIDO RAPPI</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBoVX8XacnE6OeguLOp_J3QKhfUrZnUB_4", authDomain: "kigo-xpress.firebaseapp.com", projectId: "kigo-xpress", storageBucket: "kigo-xpress.firebasestorage.app", messagingSenderId: "358613713443", appId: "1:358613713443:web:0b9d407dab250f13c56796" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let primerCarga=true, sonidoActivado=false, tabActual='activos', pedidos=[];
const audioContext = new (window.AudioContext||window.webkitAudioContext)();

// SONIDO TIPO RAPPI DE 3 SEGUNDOS
function sonarRappi3Seg(){
 if(!sonidoActivado) return;
 let tiempo=0;
 const intervalo=setInterval(()=>{
  const osc=audioContext.createOscillator(); const gain=audioContext.createGain();
  osc.type="square"; osc.frequency.value=880; gain.gain.value=0.3;
  osc.connect(gain); gain.connect(audioContext.destination);
  osc.start(); gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime+0.2);
  setTimeout(()=>osc.stop(),200);
  tiempo+=250;
  if(tiempo>=3000) clearInterval(intervalo);
 },250);
 if('vibrate' in navigator) navigator.vibrate([400,100,400,100,400,100,800]);
}

document.getElementById("activarSonido").addEventListener("click", async()=>{
 sonidoActivado=true; await audioContext.resume(); sonarRappi3Seg();
 document.getElementById("activarSonido").innerText="✅ SONIDO ACTIVO"; setTimeout(()=>document.getElementById("activarSonido").style.display="none",1500);
 if(Notification && Notification.permission!=="granted") Notification.requestPermission();
});

const q=query(collection(db,"pedidos"), orderBy("timestamp","desc"));
onSnapshot(q,(snap)=>{
 let hayNuevo=false;
 snap.docChanges().forEach(c=>{ if(c.type==="added" && !primerCarga && c.doc.data().estado==="pendiente") hayNuevo=true; });
 if(hayNuevo) sonarRappi3Seg();
 pedidos=snap.docs.map(d=>({id:d.id,...d.data()})); render(); primerCarga=false;
});
function render(){
 const activos=pedidos.filter(p=>p.estado!=="entregado"); const historial=pedidos.filter(p=>p.estado==="entregado");
 document.getElementById("contador").innerText=`${activos.length} PEDIDOS`;
 const vA=document.getElementById("vistaActivos");
 vA.innerHTML=activos.length?activos.map(p=>`<div class="card ${p.estado==="pendiente"?"nuevo":""}"><div style="display:flex;justify-content:space-between"><b>${p.numero_servicio}</b><span class="badge ${p.estado}">${p.estado}</span></div><div style="margin:8px 0">📍 <b>${p.colonia_recogida}</b> → <b>${p.colonia_entrega}</b><br><b style="font-size:20px">${p.valor_servicio}</b> ${p.distancia}</div><a href="${p.url_google_maps}" target="_blank">📍 Ver Ruta</a><div class="btns">
 ${p.estado==="pendiente"?`<button class="btn btn-rojo" onclick="cambiar('${p.id}','aceptado')">ACEPTAR</button>`:``}
 ${p.estado==="aceptado"?`<button class="btn btn-negro" onclick="cambiar('${p.id}','en_camino')">YA RECOGÍ</button>`:``}
 ${p.estado==="en_camino"?`<button class="btn btn-negro" style="background:#22c55e" onclick="cambiar('${p.id}','entregado')">ENTREGADO ✅</button>`:``}
 </div></div>`).join("") : "<p style='text-align:center;padding:40px;color:#999'>Esperando pedidos...</p>";
 const vH=document.getElementById("vistaHistorial");
 let total=0; historial.forEach(h=>total+=parseInt((h.valor_servicio||"").replace(/[^0-9]/g,""))||0);
 vH.innerHTML=historial.length?`<div style="background:#111;color:#fff;padding:12px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between"><b>${historial.length} entregas hoy</b><b>$${total}</b></div>`+historial.map(p=>`<div style="background:#f7f7f7;border:1px dashed #111;padding:10px;border-radius:12px;margin-bottom:6px;font-size:13px"><b>${p.numero_servicio}</b> ${p.colonia_recogida}→${p.colonia_entrega} ${p.valor_servicio}</div>`).join("") : "Sin historial";
}
window.cambiar=async(id,est)=>{await updateDoc(doc(db,"pedidos",id),{estado:est})};
window.switchTab=(t)=>{document.getElementById("tabActivos").classList.toggle("active",t==="activos");document.getElementById("tabHistorial").classList.toggle("active",t==="historial");document.getElementById("vistaActivos").style.display=t==="activos"?"block":"none";document.getElementById("vistaHistorial").style.display=t==="historial"?"block":"none";}
</script></body></html>
