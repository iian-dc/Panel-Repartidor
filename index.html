<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Repartidor - Kigo Xpress</title>
<style>body{font-family:sans-serif;background:#f3f4f6;margin:0;padding:15px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer;margin-right:6px}.aceptar{background:#22c55e;color:#fff}.eliminar{background:#ef4444;color:#fff}.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}.pendiente{background:#fef3c7;color:#92400e}.aceptado{background:#dcfce7;color:#166534}.en_camino{background:#dbeafe;color:#1e40af}.entregado{background:#111;color:#fff}</style>
</head><body>
<h2>🛵 Panel Repartidor - Kigo Xpress</h2><div id="lista">Cargando...</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBoVX8XacnE6OeguLOp_J3QKhfUrZnUB_4",
  authDomain: "kigo-xpress.firebaseapp.com",
  projectId: "kigo-xpress",
  storageBucket: "kigo-xpress.firebasestorage.app",
  messagingSenderId: "358613713443",
  appId: "1:358613713443:web:0b9d407dab250f13c56796",
  measurementId: "G-FDP4Q838T0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const lista=document.getElementById("lista");
const q=query(collection(db,"pedidos"), orderBy("timestamp","desc"));
onSnapshot(q,(snap)=>{
  if(snap.empty){lista.innerHTML="No hay pedidos aún";return}
  lista.innerHTML="";
  snap.forEach(d=>{
    const p=d.data();
    const div=document.createElement("div"); div.className="card";
    div.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${p.numero_servicio}</b><span class="badge ${p.estado}">${p.estado.toUpperCase()}</span></div>
    <p>📍 <b>${p.colonia_recogida}</b> → <b>${p.colonia_entrega}</b><br>💰 ${p.valor_servicio} | 📏 ${p.distancia} | ⏱️ ${p.tiempo_estimado}<br>🕒 ${p.fecha_hora}</p>
    <a href="${p.url_google_maps}" target="_blank">📍 Ver Ruta</a><br><br>
    <button class="btn aceptar" onclick="window.cambiar('${d.id}','aceptado')">Aceptar</button>
    <button class="btn aceptar" style="background:#3b82f6" onclick="window.cambiar('${d.id}','en_camino')">En camino</button>
    <button class="btn aceptar" style="background:#111" onclick="window.cambiar('${d.id}','entregado')">Entregado</button>
    <button class="btn eliminar" onclick="window.eliminar('${d.id}')">Eliminar</button>`;
    lista.appendChild(div);
  });
});
window.cambiar=async(id,est)=>{await updateDoc(doc(db,"pedidos",id),{estado:est})};
window.eliminar=async(id)=>{if(confirm("¿Eliminar?"))await deleteDoc(doc(db,"pedidos",id))};
</script>
</body></html>
